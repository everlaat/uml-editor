name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Branches that publish are already built and tested by the Pages deploy.
    if: >-
      github.event_name == 'pull_request'
      || (github.ref_name != 'main' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Catches a story that no longer compiles or renders.
      - run: npm run build-storybook
